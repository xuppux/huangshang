# --- low power / screen-off / power on-off ---------------------------------
# The stock watch demo leaves these OFF. Because of that, the PM code that has
# always been sitting in watch_demo.c - the 10s no-touch screen-off, the
# long-press shutdown box, the key wakeup - was never compiled in at all.
# Turning them on is what actually makes that code come alive.
#   BSP_USING_PM : enables the PM framework (pulls in RT_USING_PM)
#   GUI_APP_PM   : compiles gui_app_pm.c, the screen-off/wakeup state machine
#                  (middleware/system/SConscript gates it on this config)
CONFIG_BSP_USING_PM=y
CONFIG_GUI_APP_PM=y
# PM mode on SF32LB52X: Deep. This is the Kconfig default for this SoC; written
# out explicitly so a later edit cannot silently flip it to something else.
CONFIG_PM_DEEP_ENABLE=y
# --- 蓝牙（BLE）校时 ---------------------------------------------------------
# 目的：拔电 RTC 归零后，不用连电脑也能把时间对回来。
#
#   BLUETOOTH     : 打开蓝牙。它会 select BSP_BLE_SIBLES（见
#                   middleware/bluetooth/Kconfig:20），后者才是真正把
#                   middleware/bluetooth 下 porting/service/lib 挂进构建的开关。
#                   ⚠ 只写 BSP_BLE_SIBLES 是没用的：它 depends on BLUETOOTH。
#   BSP_BLE_TIMES : 编译 gatt_service/bf0_ble_tips.c —— 标准「当前时间服务」
#                   (CTS, UUID 0x1805) 的服务端。这个文件在 SDK 里已经写好，
#                   但整份 SDK 没有任何示例调用它，属于现成但没人用过的料。
#                   开了它，手机上的通用蓝牙调试 App 也能直接给手表对时。
CONFIG_BLUETOOTH=y
CONFIG_BSP_BLE_TIMES=y

# 关掉 HCI 跟踪日志。
#
# 板级 board.conf 里默认是 CONFIG_HCI_ON_LOG=y + CONFIG_LOG_ON_CONSOLE=y，
# 意思是把蓝牙协议栈的 HCI 报文跟踪（命令/事件/数据包）整包丢进 ulog，
# 和系统日志混在同一个控制台（也就是 uart1）上打出来。
#
# 之前没开蓝牙，这个开关是死的，看不出来；一开蓝牙它就开始往外喷。
# 而串口**恰恰是唯一能看见蓝牙内部状态的通道**（屏幕只能显示"广播中"，
# "协议栈起没起来/手机连上没/时间写进来没"全得靠日志）。
# 被 HCI 报文刷屏之后，我自己的 ble: / ble_adv: / ble_time: 那几行就找不着了。
#
# 所以首次点亮阶段先关掉，要的是"能读的日志"。
# 如果协议栈起不来、需要看 HCPU↔LCPU 到底有没有在通信，再把它打开做二线诊断：
#   CONFIG_HCI_DISABLE=y   ->  改成  # CONFIG_HCI_DISABLE is not set
#                             再补 CONFIG_HCI_ON_LOG=y / CONFIG_LOG_ON_CONSOLE=y
# 配置合并顺序是 board.conf 在前、本文件在后（tools/build/building.py:1561），
# 所以这里的写法会盖掉板级默认值。
CONFIG_HCI_DISABLE=y

# --- NVDS 存储（蓝牙的 MAC 地址 / 配对密钥存哪）-----------------------------
# 没有这两行会怎样？开机日志里会出现：
#     E/nvds mbox: nvds(0) flush failed
#     E/nvds mbox: nvds(1) flush failed
#
#   PKG_USING_FLASHDB : FlashDB（键值数据库）。
#     蓝牙的 NVDS 读写最终落到 middleware/bluetooth/service/common/bf0_bt_nvds.c
#     的 sifli_nvds_flash_adaptor_read/write/init，而那几个函数是 **__WEAK**
#     的，真实现只有两个来源：EF_USING_ENV（EasyFlash）或 PKG_USING_FLASHDB。
#     两个都没开 = 用的是空壳：init 返回 NVDS_FAIL、write 返回
#     NVDS_TAG_NOT_DEFINED。于是每次存 MAC/密钥都失败。
#     （对照 SDK 自带示例：example/ble/peripheral、example/bt/* 的 proj.conf
#      都写了这一条 —— 它们默认就带。）
#     存储位置不用我们操心：板级 hcpu/custom_mem_map.h 里已经有 FAL 分区
#         {FAL_PART_MAGIC_WORD, "ble", NOR_FLASH2_DEV_NAME, KVDB_BLE_REGION_OFFSET, ...}
#     flash 表 ptab.json 里也预留了 KVDB_BLE_REGION（0x00C24000，16KB）。
#     这块板子本来就是按"支持蓝牙"设计的，只是工程配置没把开关打开。
#
#   PKG_FLASHDB_DEBUG : FlashDB 自己的调试日志。默认是 y，会往外刷它内部的
#     块擦写细节，把串口淹掉。照抄 SDK 示例（example/bt/HCI_over_uart）的写法关掉。
CONFIG_PKG_USING_FLASHDB=y
# CONFIG_PKG_FLASHDB_DEBUG is not set

# --- 电池电量（表盘右上角的百分比 + 电池图标）--------------------------------
# 板子上电池正极 -> 芯片 GPADC1 的通道 7，**芯片内部已经接好 1/2 分压**，
# 外面不用再焊分压电阻（adc/README.md 的「ADC配置流程」一节写的就是这一路）。
#
# 两个开关缺一不可：
#   BSP_USING_ADC  ：板级 board.conf 里已经开了，管的是整个 ADC 驱动
#   BSP_USING_ADC1 ：寄存器实例 gpadc1，**这才是把设备注册成 "bat1" 的那一个**
#                    （drv_adc.c:845 起，实例是 gpadc1 就把名字写成 bat1）
#
# 不开 ADC1 会怎样：代码照样编译通过、照样烧进去，但 rt_device_find("bat1")
# 返回空，表盘右上角永远显示 "--%"，串口只会打一行
#     bat: device "bat1" not found -> proj.conf needs CONFIG_BSP_USING_ADC1=y
# 这是个很容易查半天的坑，所以特意写在注释里。
CONFIG_BSP_USING_ADC1=y

# --- 手电筒 app 的那颗灯：WS2812（PA32）--------------------------------------
# 手电筒的光源有两处：屏幕本身（白底 + 背光 100%）和这颗 RGB 灯。
# 屏幕那部分是纯 LVGL，不需要任何开关；下面这几行是**灯**需要的。
#
# 五行全部照抄 SDK 为这颗芯片给的现成例程，一个都不能少 ——
# 它们落在 watch/ws2812/project/proj.conf 和
# sifli-sdk/example/rt_device/rgb_led/project/sf32lb52*/proj.conf 里，
# 两处对本板（lb52 + pwm3 + CH1）的取值完全一致。
#
#   BSP_PWM3_UPDATE_USING_DMA : ⚠⚠ 是 **UPDATE**，不是 CC1！这一个字之差就是
#                           "串口全绿、灯不亮"的根因，务必别改。
#
#                           原因在驱动里写死的 dma_type：
#                             drv_rgbled.c:189   config.dma_type = 0;
#                             drv_pwm.c:838-841  if (dma_type) pwm_dma = pwm_cc_dma[ch-1];
#                                                else          pwm_dma = pwm_update_dma;
#                           dma_type=0 → 走 pwm_update_dma → 只有
#                           BSP_PWM3_UPDATE_USING_DMA 会把它赋成非 NULL
#                           （drv_pwm.c:191-197）。开了 CC1 那个宏是没用的。
#
#                           两者在硬件上也是不同的事件源（boards/.../pwm_config.h:144 vs 157）：
#                             UPDATE : .dma_handle_index = GPT_DMA_ID_UPDATE ← 周期更新事件
#                             CC1    : .dma_handle_index = GPT_DMA_ID_CC1
#                           WS2812 要把几百个占空比**每周期递进一个**地打出去，
#                           只有"周期更新"触发的 DMA 能做到；挂在通道比较事件上时序全歪。
#
#                           ⚠ 踩坑记录：这里原本被我错写成 BSP_PWM3_CC1_USING_DMA，
#                           后果是 pwm_update_dma 保持 NULL，而 PWM_CMD_SET/ENABLE
#                           在 DMA 为 NULL 时仍然返回 RT_EOK —— 于是
#                           torch_info 里 ret=0、rgbled=OK，灯却一点不亮，
#                           查了好几轮都怀疑是硬件。**配置名一定照抄例程，别按字面猜。**
#                           权威取值见 example/rt_device/rgb_led/project/proj.conf:1
#                           （52x 是 =y；56x/58x 是 =n，因为那两款的灯不在 pwm3 上）。
#   RGB_SK6812MINI_HS_ENABLE : 编译 customer/peripherals/rgb/drv_rgbled.c，
#                            并带出 BSP_RGB_LED_COUNT（默认 1）。
#                            不开它，torch 里的 TORCH_HAS_LED 就是 0，手电筒退化成
#                            "只有屏幕亮"—— 功能还在，只是那颗小灯不动。
#   RGB_USING_SK6812MINI_HS_DEV_NAME : **这一个才是注册设备名的开关**。
#                            它一开，驱动里 RGBLED_NAME 才被定义成 "rgbled"；
#                            不开的话 rt_device_find("rgbled") 永远返回空。
#   ..._PWM_DEV_NAME="pwm3" + BSP_USING_RGBLED_CH=1 : 灯挂在 pwm3 的通道 1 上。
#                            （PWM2 被 LCD 背光占着，别改到 2。）
#
# ⚠ 光开这些还不够：灯珠是**片上 LDO3_3V3 供电**的，运行时必须先
#   HAL_PMU_ConfigPeriLdo(PMU_PERI_LDO3_3V3, true, true)；
#   而且 PA32 在板级 bsp_pinmux.c 里默认被初始化成 GPIO_A32（下拉），
#   要重新映射成 GPTIM2_CH1。这两件事在 gui_apps/torch/main.c 的
#   led_hw_init() 里做。漏掉任何一件，串口全绿、灯不亮。
CONFIG_BSP_PWM3_UPDATE_USING_DMA=y
CONFIG_RGB_SK6812MINI_HS_ENABLE=y
CONFIG_RGB_USING_SK6812MINI_HS_DEV_NAME=y
CONFIG_RGB_USING_SK6812MINI_HS_PWM_DEV_NAME="pwm3"
CONFIG_BSP_USING_RGBLED_CH=1

# --- BLE 串口透传：手表 <-> 手机/电脑 的数据通道 -------------------------------
# 用途：让手表能把文字收发出去。这是「手表上的 AI 问答助手」的第一块地基 ——
#       这块板**没有 WiFi**，要联网只能借手机/电脑，而借的通道就是这个。
#
# SDK 里已经写好一个完整的服务端，源码 19KB，功能齐全：
#   middleware/bluetooth/service/ble/gatt_service/bf0_sibles_serial_trans_service.c
#   middleware/bluetooth/include/bf0_sibles_serial_trans_service.h
# 它提供：
#   - 一个自定义 GATT 服务（UUID 就是 "sifli_sd" 的 ASCII 字节）
#   - configure / data 两个特征值
#   - **自动分包**（Flag: 0x00 完整包 / 0x01 首包 / 0x02 续包 / 0x03 末包）
#     → 所以发送长度不受 BLE 单包 20 字节的限制，长文本也能传
#   - CategoryID 区分用途：DFU(0x01) / Console(0x02) / Log(0x03) /
#     Watchface(0x04) / EQ(0x05) / **Customize(0x10)**
#     最后那个 0x10 是官方**专门留给第三方自定义**的，我们用这个，不跟系统服务打架。
#   - API 三个：
#       BLE_SERIAL_TRAN_EXPORT(cate_id, callback)  注册「我这一类数据」的回调
#       ble_serial_tran_send_data(&data)           发数据
#       rt_ble_serial_dev_register("name")         把它注册成一个 RT-Thread 设备
#                                                  → 之后能 rt_device_read/write，
#                                                    像用普通串口一样用它
#
# ⚠⚠ 为什么之前一直没人用上它 —— 一个很好用的静态判断法：
#   这个宏**没开**，但源码一直躺在 SDK 里。从**编译产物的大小**就能看出来：
#       bf0_sibles_serial_trans_service.c   19416 字节
#       bf0_sibles_serial_trans_service.o    2332 字节   ← 只有 1/8
#   因为整个 .c 被 `#ifdef BSP_BLE_SERIAL_TRANSMISSION` 包着，宏没开就是空壳。
#   **所以「build 目录里有 .o」完全不能证明服务被编进去了 —— 要看 .o 有多大。**
#   开完这个宏再编，这个 .o 应该会从 2.3KB 涨到 10KB 以上，那就是硬证据。
#
# 依赖：`depends on BSP_BLE_SIBLES`（middleware/bluetooth/Kconfig:20 起）——
#       而 CONFIG_BLUETOOTH=y 已经把它带出来了，所以这里只需加这一行。
CONFIG_BSP_BLE_SERIAL_TRANSMISSION=y
